<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>战争地形图渲染器 Demo</title>
<style>
:root{--paper:#f5f0e6;--panel:rgba(255,255,255,.82)}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(#ddd7ca,#e9e4da);color:#2d2d2d}
.wrap{display:grid;grid-template-columns:320px 1fr;gap:16px;padding:16px;height:100vh;box-sizing:border-box}.panel{background:var(--panel);border:1px solid rgba(70,60,50,.18);border-radius:16px;box-shadow:0 8px 28px rgba(0,0,0,.08);overflow:hidden}.side{padding:16px;overflow:auto}.sub{font-size:13px;color:#666;line-height:1.45;margin:0 0 12px}h1{font-size:20px;margin:0 0 10px}label{display:block;font-size:13px;color:#555;margin:10px 0 6px}select,button{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #c9c3b9;background:#fffdf8;font-size:14px;box-sizing:border-box}button{cursor:pointer;background:linear-gradient(#fffef9,#f2ece1)}.toggles{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;margin-top:8px}.toggles label{display:flex;align-items:center;gap:8px;margin:0;font-size:13px}.chiprow{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 12px}.chip{padding:6px 10px;border-radius:999px;background:#ede7da;font-size:12px;border:1px solid #d3cbbb}.info{font-size:13px;line-height:1.55;color:#444;background:#faf7f1;border:1px solid #e3dbc9;padding:12px;border-radius:12px}.mapPanel{position:relative;display:flex;flex-direction:column;overflow:hidden}.toolbar{display:flex;gap:10px;padding:12px 12px 0 12px;align-items:center;flex-wrap:wrap}.canvasWrap{padding:12px;padding-top:10px;flex:1;min-height:0}canvas{width:100%;height:100%;display:block;background:var(--paper);border-radius:16px;box-shadow:inset 0 0 0 1px rgba(92,84,74,.15),0 10px 28px rgba(0,0,0,.1)}.legend{position:absolute;right:26px;bottom:26px;width:240px;background:rgba(255,250,241,.9);border:1px solid rgba(80,70,60,.16);border-radius:14px;padding:12px;font-size:12px;line-height:1.45;box-shadow:0 6px 20px rgba(0,0,0,.08)}.legend h3{margin:0 0 8px;font-size:13px}.legend .row{display:grid;grid-template-columns:18px 1fr;gap:8px;align-items:center;margin:5px 0}.sw{width:18px;height:8px;border-radius:4px;border:1px solid rgba(0,0,0,.15)}.footerNote{margin-top:10px;font-size:12px;color:#666}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}@media (max-width:1024px){.wrap{grid-template-columns:1fr;height:auto}.mapPanel{min-height:70vh}}
</style>
</head>
<body>
<div class="wrap">
  <div class="panel side">
    <h1>战争地形图渲染器 Demo</h1>
    <div class="sub">内置 10 组示例数据。渲染逻辑分为 5 层：地形底色 / 自然地貌 / 交通与聚落 / 战术要点 / 战争态势。</div>
    <label for="scenarioSelect">选择数据组</label>
    <select id="scenarioSelect"></select>
    <label>显示层</label>
    <div class="toggles">
      <label><input type="checkbox" id="toggleTerrain" checked> 地形底层</label>
      <label><input type="checkbox" id="toggleContours" checked> 等高线</label>
      <label><input type="checkbox" id="toggleNature" checked> 河流/森林</label>
      <label><input type="checkbox" id="toggleHuman" checked> 道路/城市</label>
      <label><input type="checkbox" id="toggleTactical" checked> 战术要点</label>
      <label><input type="checkbox" id="toggleWar" checked> 战争态势</label>
      <label><input type="checkbox" id="toggleGrid" checked> 坐标网格</label>
      <label><input type="checkbox" id="toggleLabels" checked> 标注</label>
    </div>
    <div class="chiprow"><div class="chip">10 组数据</div><div class="chip">单文件离线运行</div><div class="chip">可导出 PNG</div><div class="chip">Canvas 实时渲染</div></div>
    <button id="rerenderBtn">重新渲染当前地图</button>
    <div style="height:8px"></div>
    <button id="exportBtn">导出当前地图 PNG</button>
    <label>当前数据摘要</label>
    <div id="infoBox" class="info"></div>
    <div class="footerNote">说明：这不是 AI 一次性生成的静态图片，而是可重复渲染的程序地图。<br>相同的数据 + 相同 seed，会得到稳定一致的地图结构。<br><span class="mono">示例文件：单 HTML，可直接打开。</span></div>
  </div>
  <div class="panel mapPanel">
    <div class="toolbar"><div style="font-size:14px;color:#4c463f">画布大小：<span class="mono">1200 × 800</span></div><div style="font-size:14px;color:#4c463f">风格：<span class="mono">军事地形图 / 作战态势图</span></div></div>
    <div class="canvasWrap"><canvas id="mapCanvas" width="1200" height="800"></canvas></div>
    <div class="legend"><h3>图例</h3><div class="row"><div class="sw" style="background:#5ba0cf"></div><div>河流 / 湖泊</div></div><div class="row"><div class="sw" style="background:#5c6d40"></div><div>森林</div></div><div class="row"><div class="sw" style="background:#5a4638"></div><div>公路</div></div><div class="row"><div class="sw" style="background:repeating-linear-gradient(90deg,#333 0 4px,#bbb 4px 8px)"></div><div>铁路</div></div><div class="row"><div class="sw" style="background:#7c7060"></div><div>城市 / 聚落</div></div><div class="row"><div class="sw" style="background:rgba(53,111,180,.35)"></div><div>蓝方控制区</div></div><div class="row"><div class="sw" style="background:rgba(175,72,64,.35)"></div><div>红方控制区</div></div><div class="row"><div class="sw" style="background:#1f1f1f"></div><div>主战线</div></div></div>
  </div>
</div>

function drawPolyline(points){ctx.beginPath(); ctx.moveTo(mapX(points[0][0]),mapY(points[0][1])); for(let i=1;i<points.length;i++) ctx.lineTo(mapX(points[i][0]),mapY(points[i][1]))}
function drawIsolines(ds){const ec=elevationCache||buildElevation(ds), grid=ec.grid, resW=ec.resW, resH=ec.resH, levels=[0.22,0.30,0.38,0.46,0.54,0.62,0.70,0.78,0.86]; ctx.save(); ctx.strokeStyle='rgba(82,74,63,0.42)'; ctx.lineWidth=0.9; const interp=(a,b,tA,tB,level)=>{const tt=(level-a)/((b-a)||1e-9); return [lerp(tA[0],tB[0],tt), lerp(tA[1],tB[1],tt)]}; for(const level of levels){for(let j=0;j<resH-1;j++){for(let i=0;i<resW-1;i++){const v0=grid[j][i],v1=grid[j][i+1],v2=grid[j+1][i+1],v3=grid[j+1][i], mask=(v0>level?1:0)|(v1>level?2:0)|(v2>level?4:0)|(v3>level?8:0); if(mask===0||mask===15) continue; const x=i/(resW-1), y=j/(resH-1), sx=1/(resW-1), sy=1/(resH-1); const pTop=interp(v0,v1,[x,y],[x+sx,y],level), pRight=interp(v1,v2,[x+sx,y],[x+sx,y+sy],level), pBottom=interp(v3,v2,[x,y+sy],[x+sx,y+sy],level), pLeft=interp(v0,v3,[x,y],[x,y+sy],level); const map={1:[[pLeft,pTop]],2:[[pTop,pRight]],3:[[pLeft,pRight]],4:[[pRight,pBottom]],5:[[pLeft,pBottom],[pTop,pRight]],6:[[pTop,pBottom]],7:[[pLeft,pBottom]],8:[[pBottom,pLeft]],9:[[pTop,pBottom]],10:[[pTop,pLeft],[pRight,pBottom]],11:[[pRight,pBottom]],12:[[pLeft,pRight]],13:[[pTop,pRight]],14:[[pLeft,pTop]]}[mask]||[]; for(const seg of map){ctx.beginPath(); ctx.moveTo(mapX(seg[0][0]),mapY(seg[0][1])); ctx.lineTo(mapX(seg[1][0]),mapY(seg[1][1])); ctx.stroke()}}}} ctx.restore()}
function drawNature(ds){(ds.coast||[]).forEach(coast=>{ctx.save(); ctx.fillStyle='rgba(116,168,198,0.85)'; drawSmoothPoly(coast,true); ctx.fill(); ctx.restore()}); (ds.lakes||[]).forEach(lake=>{ctx.save(); ctx.fillStyle='rgba(110,166,202,0.88)'; ctx.strokeStyle='rgba(61,115,154,0.85)'; ctx.lineWidth=2; drawSmoothPoly(lake,true); ctx.fill(); ctx.stroke(); ctx.restore()}); (ds.rivers||[]).forEach(river=>{ctx.save(); ctx.strokeStyle='rgba(89,158,201,0.98)'; ctx.lineWidth=5; ctx.lineCap='round'; ctx.lineJoin='round'; drawPolyline(river); ctx.stroke(); ctx.strokeStyle='rgba(212,236,248,0.55)'; ctx.lineWidth=1.3; drawPolyline(river); ctx.stroke(); ctx.restore()}); (ds.forests||[]).forEach(forest=>{ctx.save(); drawSmoothPoly(forest,true); ctx.fillStyle='rgba(95,111,69,0.42)'; ctx.fill(); ctx.strokeStyle='rgba(74,90,50,0.75)'; ctx.lineWidth=1.5; ctx.stroke(); ctx.clip(); for(let i=0;i<170;i++){const x=mapRect.x+Math.random()*mapRect.w, y=mapRect.y+Math.random()*mapRect.h, s=3+Math.random()*3; ctx.beginPath(); ctx.moveTo(x,y-s*0.9); ctx.lineTo(x-s*0.7,y+s*0.5); ctx.lineTo(x+s*0.7,y+s*0.5); ctx.closePath(); ctx.fillStyle=Math.random()>0.5?'rgba(61,87,46,0.35)':'rgba(83,104,56,0.35)'; ctx.fill()} ctx.restore()})}
function drawHuman(ds){(ds.roads||[]).forEach(road=>{ctx.save(); ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle=road.kind==='primary'?'#5d4a3d':'#7a6a58'; ctx.lineWidth=road.kind==='primary'?4.2:3; drawPolyline(road.pts); ctx.stroke(); ctx.strokeStyle='rgba(248,240,225,0.65)'; ctx.lineWidth=road.kind==='primary'?1.2:0.8; drawPolyline(road.pts); ctx.stroke(); ctx.restore()}); (ds.rails||[]).forEach(rail=>{ctx.save(); ctx.strokeStyle='#3c3c3c'; ctx.lineWidth=2.3; drawPolyline(rail.pts); ctx.stroke(); ctx.strokeStyle='rgba(235,231,224,0.8)'; ctx.lineWidth=0.7; ctx.setLineDash([1,12]); drawPolyline(rail.pts); ctx.stroke(); ctx.restore()}); (ds.cities||[]).forEach(city=>{ctx.save(); drawSmoothPoly(city.poly,true); ctx.fillStyle='rgba(122,113,97,0.66)'; ctx.strokeStyle='rgba(77,70,61,0.9)'; ctx.lineWidth=1.4; ctx.fill(); ctx.stroke(); ctx.clip(); const minX=Math.min(...city.poly.map(p=>mapX(p[0]))), maxX=Math.max(...city.poly.map(p=>mapX(p[0]))), minY=Math.min(...city.poly.map(p=>mapY(p[1]))), maxY=Math.max(...city.poly.map(p=>mapY(p[1]))); ctx.strokeStyle='rgba(248,245,238,0.42)'; ctx.lineWidth=1; for(let x=minX;x<maxX;x+=16){ctx.beginPath();ctx.moveTo(x,minY);ctx.lineTo(x,maxY);ctx.stroke()} for(let y=minY;y<maxY;y+=16){ctx.beginPath();ctx.moveTo(minX,y);ctx.lineTo(maxX,y);ctx.stroke()} ctx.restore()}); (ds.villages||[]).forEach(v=>{const x=mapX(v.x), y=mapY(v.y); ctx.save(); ctx.fillStyle='#7c6d5c'; ctx.beginPath(); ctx.arc(x,y,4,0,Math.PI*2); ctx.fill(); ctx.strokeStyle='rgba(255,255,255,0.75)'; ctx.lineWidth=1; ctx.stroke(); ctx.restore()})}
function drawTactical(ds){(ds.pois||[]).forEach(poi=>{const x=mapX(poi.x), y=mapY(poi.y); ctx.save(); ctx.strokeStyle='#222'; ctx.fillStyle='#f8f3e7'; ctx.lineWidth=1.3; if(poi.type==='bridge'){ctx.strokeStyle='#1f1f1f'; ctx.lineWidth=1.8; ctx.beginPath(); ctx.moveTo(x-10,y); ctx.lineTo(x+10,y); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x-6,y-5); ctx.quadraticCurveTo(x,y-10,x+6,y-5); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x-6,y+5); ctx.quadraticCurveTo(x,y+10,x+6,y+5); ctx.stroke()} else if(poi.type==='height'){ctx.beginPath(); ctx.moveTo(x,y-8); ctx.lineTo(x-8,y+6); ctx.lineTo(x+8,y+6); ctx.closePath(); ctx.fill(); ctx.stroke()} else if(poi.type==='pass'){ctx.beginPath(); ctx.rect(x-7,y-5,14,10); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x-10,y); ctx.lineTo(x+10,y); ctx.stroke()} else {ctx.beginPath(); ctx.arc(x,y,6,0,Math.PI*2); ctx.fill(); ctx.stroke(); if(poi.type==='fort'){ctx.beginPath(); ctx.rect(x-8,y-8,16,16); ctx.stroke()} if(poi.type==='railhub'){ctx.beginPath(); ctx.moveTo(x-10,y); ctx.lineTo(x+10,y); ctx.moveTo(x,y-10); ctx.lineTo(x,y+10); ctx.stroke()} if(poi.type==='industry'){ctx.beginPath(); ctx.moveTo(x-8,y+6); ctx.lineTo(x-8,y-3); ctx.lineTo(x-3,y-7); ctx.lineTo(x+3,y-2); ctx.lineTo(x+3,y+6); ctx.closePath(); ctx.stroke()} if(poi.type==='port'){ctx.beginPath(); ctx.moveTo(x-7,y+7); ctx.lineTo(x+7,y+7); ctx.moveTo(x,y-8); ctx.lineTo(x,y+7); ctx.stroke()}} if(controls.labels.checked){ctx.fillStyle='#201f1d'; ctx.font='12px sans-serif'; ctx.fillText(poi.name,x+10,y-6)} ctx.restore()})}
function drawWar(ds){(ds.controlZones||[]).forEach(zone=>{ctx.save(); ctx.fillStyle=zone.side==='blue'?'rgba(53,111,180,0.16)':'rgba(175,72,64,0.17)'; drawSmoothPoly(zone.poly,true); ctx.fill(); ctx.restore()}); (ds.fronts||[]).forEach(front=>{ctx.save(); ctx.strokeStyle='#1f1f1f'; ctx.lineWidth=3.2; ctx.setLineDash([10,8]); drawPolyline(front.pts); ctx.stroke(); ctx.setLineDash([]); front.pts.forEach(p=>{const x=mapX(p[0]), y=mapY(p[1]); ctx.fillStyle='#1f1f1f'; ctx.beginPath(); ctx.arc(x,y,2,0,Math.PI*2); ctx.fill()}); if(controls.labels.checked){const m=front.pts[Math.floor(front.pts.length/2)]; ctx.fillStyle='#1f1f1f'; ctx.font='bold 12px sans-serif'; ctx.fillText(front.name,mapX(m[0])+10,mapY(m[1])-10)} ctx.restore()}); (ds.units||[]).forEach(unit=>{const x=mapX(unit.x), y=mapY(unit.y), w=58, h=24; ctx.save(); ctx.fillStyle=unit.side==='blue'?'#426ea7':'#b45b51'; ctx.strokeStyle='rgba(255,255,255,0.92)'; ctx.lineWidth=1.2; ctx.beginPath(); ctx.roundRect(x-w/2,y-h/2,w,h,6); ctx.fill(); ctx.stroke(); ctx.fillStyle='#fff'; ctx.font='bold 12px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(unit.label,x,y+0.5); ctx.restore()})}
function drawGrid(){ctx.save(); ctx.strokeStyle='rgba(78,70,60,0.18)'; ctx.lineWidth=1; ctx.font='11px ui-monospace, monospace'; ctx.fillStyle='rgba(60,54,48,0.62)'; const cols=10, rows=8; for(let i=0;i<=cols;i++){const x=mapRect.x+mapRect.w*i/cols; ctx.beginPath(); ctx.moveTo(x,mapRect.y); ctx.lineTo(x,mapRect.y+mapRect.h); ctx.stroke(); if(i<cols) ctx.fillText(String.fromCharCode(65+i),x+6,mapRect.y+14)} for(let j=0;j<=rows;j++){const y=mapRect.y+mapRect.h*j/rows; ctx.beginPath(); ctx.moveTo(mapRect.x,y); ctx.lineTo(mapRect.x+mapRect.w,y); ctx.stroke(); if(j<rows) ctx.fillText(String(j+1),mapRect.x+6,y+14)} ctx.restore()}
function drawFrameTitle(ds){ctx.save(); ctx.strokeStyle='rgba(88,80,71,0.55)'; ctx.lineWidth=2; ctx.strokeRect(mapRect.x,mapRect.y,mapRect.w,mapRect.h); ctx.fillStyle='rgba(36,34,31,0.92)'; ctx.font='bold 20px sans-serif'; ctx.fillText(`战争地形图 · ${ds.name}`,mapRect.x+10,24); ctx.font='12px ui-monospace, monospace'; ctx.fillStyle='rgba(68,61,54,0.8)'; ctx.fillText(`seed=${ds.seed} · 五层渲染：terrain / nature / human / tactical / war`,mapRect.x+10,H-10); ctx.textAlign='right'; ctx.fillText('比例尺（示意）1 : 150,000',mapRect.x+mapRect.w-10,24); ctx.textAlign='left'; ctx.restore()}
function updateInfo(ds){infoBox.innerHTML=`<b>${ds.name}</b><br>seed：<span class="mono">${ds.seed}</span><br>河流：${(ds.rivers||[]).length} 条；森林区：${(ds.forests||[]).length} 片；道路：${(ds.roads||[]).length} 条；铁路：${(ds.rails||[]).length} 条<br>城市/镇区：${(ds.cities||[]).length} 个；村点：${(ds.villages||[]).length} 个；战术要点：${(ds.pois||[]).length} 个；单位：${(ds.units||[]).length} 个<br>主战线：${(ds.fronts||[]).map(f=>f.name).join('，') || '无'}`}
function drawLabels(ds){ctx.save(); ctx.fillStyle='rgba(36,33,30,0.93)'; ctx.strokeStyle='rgba(248,245,238,0.86)'; ctx.lineWidth=3; function label(txt,x,y,size=13,weight='600'){ctx.font=`${weight} ${size}px sans-serif`; ctx.strokeText(txt,x,y); ctx.fillText(txt,x,y)} (ds.cities||[]).forEach(city=>{const cx=city.poly.reduce((s,p)=>s+p[0],0)/city.poly.length, cy=city.poly.reduce((s,p)=>s+p[1],0)/city.poly.length; label(city.name,mapX(cx)+8,mapY(cy)-8,14,'700')}); (ds.villages||[]).forEach(v=>label(v.name,mapX(v.x)+7,mapY(v.y)-7,12,'500')); ctx.restore()}
function render(ds){currentScenario=ds; ctx.clearRect(0,0,W,H); ctx.fillStyle='#f3eee2'; ctx.fillRect(0,0,W,H); for(let i=0;i<1300;i++){const x=Math.random()*W, y=Math.random()*H, a=Math.random()*0.025; ctx.fillStyle=`rgba(70,52,38,${a})`; ctx.fillRect(x,y,1,1)} if(controls.terrain.checked) drawTerrain(ds); else elevationCache=buildElevation(ds); if(controls.contours.checked) drawIsolines(ds); if(controls.nature.checked) drawNature(ds); if(controls.human.checked) drawHuman(ds); if(controls.grid.checked) drawGrid(); if(controls.tactical.checked) drawTactical(ds); if(controls.war.checked) drawWar(ds); if(controls.labels.checked) drawLabels(ds); drawFrameTitle(ds); updateInfo(ds)}
SCENARIOS.forEach((s,idx)=>{const op=document.createElement('option'); op.value=idx; op.textContent=`${s.id.toUpperCase()} · ${s.name}`; scenarioSelect.appendChild(op)}); scenarioSelect.addEventListener('change',e=>render(SCENARIOS[+e.target.value])); Object.values(controls).forEach(el=>el.addEventListener('change',()=>render(currentScenario))); rerenderBtn.addEventListener('click',()=>render(currentScenario)); exportBtn.addEventListener('click',()=>{const a=document.createElement('a'); a.href=canvas.toDataURL('image/png'); a.download=`war_terrain_${currentScenario.id}.png`; a.click()}); render(currentScenario);
</script>
