<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>边界纪元 · 国家策略沙盒</title><style>:root{--bg:#0b1018;--panel:#121a25;--panel2:#182333;--text:#eaf1f8;--muted:#9db0c4;--line:#2a3a4e;--good:#66d19e;--warn:#e8c166;--bad:#ef7b7b;}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}body{overflow:hidden}#app{display:grid;grid-template-columns:minmax(0,1fr) 330px;grid-template-rows:56px minmax(0,1fr);height:100vh;height:100dvh}header{grid-column:1/3;display:flex;align-items:center;gap:12px;padding:0 16px;background:#0f1722;border-bottom:1px solid var(--line)}.brand{font-weight:800;letter-spacing:.05em}.sub{color:var(--muted);font-size:12px}.spacer{flex:1}button,select{background:#182333;color:var(--text);border:1px solid #31445c;border-radius:9px;padding:8px 10px}button{cursor:pointer}button:hover{background:#213046}button.primary{background:#27624e;border-color:#337d64}#mapWrap{position:relative;overflow:hidden;background:#0a1520}canvas{width:100%;height:100%;display:block}#hud{position:absolute;left:14px;top:14px;display:flex;gap:8px;pointer-events:none}.pill{background:#0d1520dd;border:1px solid #33445a;border-radius:10px;padding:7px 10px;backdrop-filter:blur(8px)}#legend{position:absolute;left:14px;bottom:14px;background:#0d1520dd;border:1px solid #33445a;border-radius:12px;padding:10px 12px;color:var(--muted);font-size:12px}#right{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}.tabs{display:flex;border-bottom:1px solid var(--line)}.tab{flex:1;text-align:center;padding:12px 5px;color:var(--muted);cursor:pointer}.tab.active{color:var(--text);background:#172131}.panel{display:none;padding:14px;overflow:auto;min-height:0}.panel.active{display:block}.countryTitle{display:flex;align-items:center;gap:9px;margin-bottom:12px}.swatch{width:14px;height:14px;border-radius:50%}h2,h3{margin:4px 0 10px}h2{font-size:18px}h3{font-size:14px;color:#c9d8e8}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{padding:9px;background:#182333;border:1px solid #26374a;border-radius:10px}.stat b{display:block;font-size:16px}.stat span{color:var(--muted);font-size:12px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.action{min-height:58px;text-align:left}.action small{display:block;color:var(--muted)}.event{padding:9px 0;border-bottom:1px solid #223144}.event time{color:var(--muted);font-size:11px}.event b{display:block;margin-top:2px}.card{background:#182333;border:1px solid #293b50;border-radius:12px;padding:11px;margin-bottom:10px}.bar{height:7px;background:#0d1520;border-radius:99px;overflow:hidden;margin-top:6px}.bar>i{display:block;height:100%;background:currentColor}.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}.dipl-row{display:grid;grid-template-columns:1fr 62px 70px;gap:7px;align-items:center;padding:7px 0;border-bottom:1px solid #223144}#modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#03070db8;z-index:20}#modal.show{display:flex}.modalBox{width:min(560px,92vw);background:#141e2b;border:1px solid #38506a;border-radius:16px;padding:18px;box-shadow:0 20px 80px #0009}.choices{display:grid;gap:9px;margin-top:12px}.choices button{text-align:left;padding:12px}.choices button small{display:block;color:var(--muted);margin-top:3px}.notice{position:absolute;right:14px;top:14px;width:min(380px,40vw);pointer-events:none}.toast{background:#101925ed;border:1px solid #3d5169;border-radius:11px;padding:10px 12px;margin-bottom:8px;animation:fade 4s forwards}@keyframes fade{0%,70%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-8px)}}#start{position:fixed;left:0;right:0;top:56px;bottom:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));background:radial-gradient(circle at 50% 40%,#193248,#09111b 65%)}.startbox{width:min(660px,90%);padding:28px;background:#0e1722e6;border:1px solid #3a536e;border-radius:20px;text-align:center}.startbox h1{margin:0 0 8px;font-size:32px}.startbox p{color:#aabbd0}.startgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.startgrid .card{margin:0}@media(max-width:850px){#app{grid-template-columns:1fr;grid-template-rows:56px 58vh minmax(0,1fr)}header{grid-column:1}#right{border-left:0;border-top:1px solid var(--line)}}
#pendingEventBar{display:none;padding:12px;border-bottom:1px solid var(--line);background:#111b28}
#pendingEventBar.show{display:block}

}

</style></head><body><div id="app"><header><div><div class="brand">边界纪元</div><div class="sub">20–40 分钟国家策略沙盒</div></div><div class="spacer"></div><button id="pauseBtn">暂停</button><select id="speedSel"><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option><option value="8">8×</option></select><button id="newBtn">新世界</button></header><main id="mapWrap"><canvas id="map"></canvas><div id="hud"><div class="pill">年份 <b id="year">1</b></div><div class="pill">行动点 <b id="ap">3</b>/4</div><div class="pill">目标 <b id="goalShort">120 年内：前三并连续保持 10 年</b></div><div class="pill">排名 <b id="rank">—</b></div><div class="pill">前三连续 <b id="streak">0</b>/10</div><div class="pill">世界局势 <b id="tension">平静</b></div></div><div class="notice" id="notice"></div><div id="legend">滚轮缩放 · 拖动地图 · 点击国家查看<br>地图没有可见格子；底层区域仅用于模拟。</div><div id="start"><div class="startbox"><h1>边界纪元</h1><p>你不是在玩一张会换颜色的格子图。各国会根据威胁、财政、外交和战争收益改变策略。</p><div class="startgrid"><div class="card"><b>连续疆界</b><br><small>平滑大陆与国家边界</small></div><div class="card"><b>有限行动</b><br><small>行动收益会递减，不能无脑连点</small></div><div class="card"><b>会权衡的国家</b><br><small>会因边境、实力与国际紧张度改变战略</small></div></div><button class="primary" id="startBtn">生成世界并开始</button></div></div></main><aside id="right"><div id="pendingEventBar"></div><div class="tabs"><div class="tab active" data-tab="country">国家</div><div class="tab" data-tab="dipl">外交</div><div class="tab" data-tab="events">事件</div></div><section class="panel active" id="countryPanel"></section><section class="panel" id="diplPanel"></section><section class="panel" id="eventsPanel"></section></aside></div><div id="modal"><div class="modalBox"><h2 id="modalTitle"></h2><div id="modalText"></div><div class="choices" id="modalChoices"></div></div></div><script>(()=>{
"use strict";
const W=260,H=150,N=14;
const canvas=document.getElementById("map"),ctx=canvas.getContext("2d");
const off=document.createElement("canvas");off.width=W;off.height=H;const ox=off.getContext("2d");
let terrain=new Uint8Array(W*H), owner=new Int16Array(W*H);
let countries=[], relations=[], wars=new Set(), events=[], player=0, selected=0;
let year=1, ap=3, paused=false, speed=1, tickAcc=0, last=performance.now(), nextEventYear=11, pendingEvent=null, resumeAfterEvent=true, worldTension=18, top3Streak=0, nextWorldEventYear=5, situations=[], mapSignals=[], threatMemory=Array(N).fill(0), playerArmyHistory=[], warPlans={}, austerity=false, lastFinance=null;
let cam={x:0,y:0,z:1},drag=null,gameStarted=false,mapDirty=true;
const colors=["#56a9e6","#e87070","#75c48a","#d69c58","#a684e8","#59c6ba","#e17cab","#9fc766","#dfc264","#758de0","#bd7956","#70a0a7","#cd6c8d","#7eb067"];
const namesA=["青河","赤原","北岚","苍湾","白岭","曜川","临海","新穹","霜谷","金泽","云岬","长风","南陆","星浦"];
const forms=["共和国","联邦","王国","联盟","公国","共同体"];
const rand=(a=1,b=0)=>Math.random()*(a-b)+b, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const idx=(x,y)=>y*W+x;
function noise2(x,y){
return Math.sin(x*.073+Math.sin(y*.11)*1.7)+Math.cos(y*.061-x*.027)+.55*Math.sin((x+y)*.13);
}
function generateTerrain(){
terrain.fill(0); owner.fill(-1);
const seeds=Array.from({length:6},()=>({x:rand(W*.9,W*.1),y:rand(H*.82,H*.18),r:rand(46,28)}));
for(let y=0;y<H;y++)for(let x=0;x<W;x++){
let f=-2.3;
for(const s of seeds){
let dx=(x-s.x),dy=(y-s.y)*1.15,d=Math.sqrt(dx*dx+dy*dy);
f=Math.max(f,1-d/s.r);
}
f += noise2(x,y)*.16 - Math.pow((y-H/2)/(H/2),4)*.6;
terrain[idx(x,y)]=f>.12?1:0;
}
for(let k=0;k<3;k++){
const n=terrain.slice();
for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){
let c=0;for(let yy=-1;yy<=1;yy++)for(let xx=-1;xx<=1;xx++) c+=n[idx(x+xx,y+yy)];
terrain[idx(x,y)]=c>=5?1:0;
}
}
}
function landPoint(){
for(let tries=0;tries<5000;tries++){
let x=Math.floor(rand(W)),y=Math.floor(rand(H));
if(terrain[idx(x,y)]) return {x,y};
}
return {x:W/2,y:H/2};
}
function generateCountries(){
countries=[];relations=Array.from({length:N},()=>Array(N).fill(0));wars.clear();
const caps=[];
for(let i=0;i<N;i++){
let p=landPoint();
for(let t=0;t<100;t++){
p=landPoint();
if(caps.every(q=>Math.hypot(p.x-q.x,p.y-q.y)>18))break;
}
caps.push(p);
countries.push({
id:i,name:namesA[i]+" "+forms[Math.floor(rand(forms.length))],color:colors[i%colors.length],cap:p,
pop:Math.round(rand(240,70)), treasury:Math.round(rand(105,55)), food:Math.round(rand(115,65)),
industry:Math.round(rand(60,22)), tech:Math.round(rand(52,18)), army:Math.round(rand(62,22)),
stability:Math.round(rand(88,58)), aggression:rand(.82,.25), caution:rand(.9,.35), trade:rand(.9,.3),
strategy:"平衡发展", alive:true, territory:0
});
}
for(let y=0;y<H;y++)for(let x=0;x<W;x++) if(terrain[idx(x,y)]){
let best=-1,bd=1e9;
for(const c of countries){
let d=Math.hypot(x-c.cap.x,y-c.cap.y);
d += Math.sin(x*.18+c.id)*2.3+Math.cos(y*.15-c.id)*2.0;
if(d<bd){bd=d;best=c.id}
}
owner[idx(x,y)]=best;
}
recount();
for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){
relations[i][j]=relations[j][i]=Math.round(rand(45,-25));
}
}
function recount(){mapDirty=true;
countries.forEach(c=>c.territory=0);
for(let i=0;i<owner.length;i++) if(owner[i]>=0) countries[owner[i]].territory++;
countries.forEach(c=>{if(c.territory<8)c.alive=false});
}
function borders(a,b){
let n=0;
for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){
let o=owner[idx(x,y)];if(o!==a)continue;
if(owner[idx(x+1,y)]===b||owner[idx(x-1,y)]===b||owner[idx(x,y+1)]===b||owner[idx(x,y-1)]===b)n++;
}
return n;
}
function visualContact(a,b){
const ca=countries[a],cb=countries[b];
if(!ca?.alive||!cb?.alive)return false;
if(borders(a,b)>=2)return true;
// fallback: if their territories are separated only by a very narrow diagonal/water gap,
// treat them as practical neighbors for diplomacy/war.
let near=0;
for(let y=2;y<H-2;y++)for(let x=2;x<W-2;x++) if(owner[idx(x,y)]===a){
for(let yy=-2;yy<=2;yy++)for(let xx=-2;xx<=2;xx++){
if(Math.abs(xx)+Math.abs(yy)>3)continue;
if(owner[idx(x+xx,y+yy)]===b){near++;if(near>=3)return true}
}
}
return false;
}
function neighbors(a){
let s=new Set();
for(let i=0;i<countries.length;i++)if(i!==a&&countries[i]?.alive&&visualContact(a,i))s.add(i);
return [...s];
}
function power(c){return c.army*1.2+c.industry*.55+c.tech*.7+c.pop*.08+c.treasury*.05}
function economy(c){return c.industry*1.3+c.pop*.25+c.tech*.45}
function logEvent(title,text,sev=""){
events.unshift({year,title,text,sev}); if(events.length>120)events.pop(); renderPanels();
}
function toast(msg){let d=document.createElement("div");d.className="toast";d.textContent=msg;document.getElementById("notice").appendChild(d);setTimeout(()=>d.remove(),4100)}
function setRelation(a,b,delta){relations[a][b]=relations[b][a]=clamp(relations[a][b]+delta,-100,100)}
function warKey(a,b){return a<b?a+"-"+b:b+"-"+a}
function atWar(a,b){return wars.has(warKey(a,b))}

function getWarPlan(a,b){
const k=warKey(a,b);
if(!warPlans[k])warPlans[k]={direction:"全线",posture:"稳步推进",objective:"消耗敌军",fatigueA:0,fatigueB:0,supplyA:100,supplyB:100};
return warPlans[k];
}
function focusWar(a,b){
const A=countries[a],B=countries[b];if(!A||!B)return;
const r=canvas.getBoundingClientRect();
const mx=(A.cap.x+B.cap.x)/2,my=(A.cap.y+B.cap.y)/2;
const base=Math.min(r.width/W,r.height/H);
cam.z=Math.max(cam.z,1.55);
const scale=base*cam.z,dw=W*scale,dh=H*scale;
const x0=(r.width-dw)/2,y0=(r.height-dh)/2;
cam.x=r.width/2-(x0+mx*scale);
cam.y=r.height/2-(y0+my*scale);
}

function objectiveEffect(plan){
let atk=1,move=1,cost=1;
if(plan.objective==="夺取首都"){atk=1.10;move=1.08;cost=1.18}
else if(plan.objective==="切断补给"){atk=1.04;move=.92;cost=1.05}
else if(plan.objective==="消耗敌军"){atk=1.02;move=.84;cost=1.00}
else if(plan.objective==="占领工业区"){atk=1.07;move=1.00;cost=1.12}
return {atk,move,cost};
}
function supplyState(c,enemy,plan,isPlayerSide){
let s=100;
s-=Math.max(0,c.army-c.industry*.75)*.42;
s-=Math.max(0,enemy.territory-c.territory)*.025;
s-=Math.max(0,40-c.food)*1.2;
if(isPlayerSide&&plan.posture==="闪击")s-=14;
if(isPlayerSide&&plan.posture==="战略撤退")s+=10;
return clamp(s,25,100);
}

function setWarPlanField(target,field,value){
const plan=getWarPlan(player,target);plan[field]=value;renderPanels();
toast(field==="direction"?`主攻方向：${value}`:`战争姿态：${value}`);
}

function declareWar(a,b){
if(atWar(a,b)||!countries[a].alive||!countries[b].alive)return;
wars.add(warKey(a,b));setRelation(a,b,-55);worldTension=clamp(worldTension+7,0,100);getWarPlan(a,b);if(a===player||b===player)setTimeout(()=>focusWar(a,b),60);
logEvent("战争爆发",`${countries[a].name} 向 ${countries[b].name} 宣战。`,"bad");addSignal(a,b,`${countries[a].name} ↔ ${countries[b].name}`,"war",12);if(a===player||b===player||neighbors(player).includes(a)||neighbors(player).includes(b))toast(`${countries[a].name} 与 ${countries[b].name} 开战，附近局势已经改变。`);
}
function peace(a,b){
wars.delete(warKey(a,b));setRelation(a,b,18);worldTension=clamp(worldTension-3,0,100);
logEvent("停战",`${countries[a].name} 与 ${countries[b].name} 签署停火协议。`);
}

function playerThreatScore(observerId){
const p=countries[player],o=countries[observerId];
if(!p?.alive||!o?.alive)return 0;
const adj=neighbors(observerId).includes(player);
const powerRatio=power(p)/Math.max(1,power(o));
const recentGrowth=playerArmyHistory.length>=4?Math.max(0,p.army-playerArmyHistory[Math.max(0,playerArmyHistory.length-4)]):0;
const expansion=situations.filter(s=>s.a===player||s.b===player).length;
let t=0;
if(adj)t+=16;
if(powerRatio>1.05)t+=(powerRatio-1)*28;
t+=recentGrowth*1.8;
t+=expansion*3;
if(relations[observerId][player]<-20)t+=8;
if(worldTension>70)t+=(worldTension-70)*.25;
return clamp(t,0,100);
}
function updateThreatPerception(){
const p=countries[player];
playerArmyHistory.push(p.army);if(playerArmyHistory.length>10)playerArmyHistory.shift();
for(const c of countries){
if(!c.alive||c.id===player)continue;
const now=playerThreatScore(c.id);
threatMemory[c.id]=threatMemory[c.id]*.72+now*.28;
}
}
function balancingBloc(){
const wary=countries.filter(c=>c.alive&&c.id!==player&&threatMemory[c.id]>=34);
if(wary.length<2)return;
wary.sort((a,b)=>threatMemory[b.id]-threatMemory[a.id]);
const a=wary[0],b=wary.find(x=>x.id!==a.id&&visualContact(x.id,a.id));
if(!b)return;
setRelation(a.id,b.id,10);
a.army+=1.8;b.army+=1.8;a.treasury-=2;b.treasury-=2;
logEvent("制衡靠拢",`${a.name} 与 ${b.name} 因担忧 ${countries[player].name} 的快速军备增长而加强合作。`,"warn");
addSignal(a.id,b.id,"制衡合作","warn",7);
}
function preventiveWarAttempt(c){
if(!c.alive||c.id===player)return false;
const ns=neighbors(c.id).filter(i=>countries[i].alive);
if(!ns.includes(player))return false;
const threat=threatMemory[c.id];
if(threat<48)return false;
const ratio=power(c)/Math.max(1,power(countries[player]));
const allies=countries.filter(x=>x.alive&&x.id!==player&&x.id!==c.id&&threatMemory[x.id]>36&&neighbors(x.id).includes(player));
let blocSupport=allies.length?1+.12*Math.min(3,allies.length):1;
let trigger=.03;
if(threat>60)trigger+=.06;
if(threat>75)trigger+=.10;
if(worldTension>70)trigger+=.05;
if(ratio*blocSupport>.82)trigger+=.08;
if(Math.random()<trigger){
declareWar(c.id,player);
c.strategy="预防性战争";
logEvent("预防性战争",`${c.name} 判断继续等待会让 ${countries[player].name} 更难制衡，于是选择提前开战。`,"bad");
for(const ally of allies.slice(0,2)){
if(Math.random()<.45&&!atWar(ally.id,player)){declareWar(ally.id,player);ally.strategy="加入制衡战争"}
}
return true;
}
return false;
}

function aiThink(c){
if(!c.alive||c.id===player)return;
if(preventiveWarAttempt(c))return;
const ns=neighbors(c.id).filter(i=>countries[i].alive);
const enemies=ns.filter(i=>atWar(c.id,i));
const threat=ns.reduce((m,i)=>Math.max(m,power(countries[i])/Math.max(1,power(c))),0);

if(c.food<40){c.strategy="保障供应";c.food+=10;c.treasury-=6;c.stability+=1;return}
if(c.treasury<18){c.strategy="财政紧缩";c.treasury+=9;c.army=Math.max(3,c.army-1.5);c.stability-=.4;return}

if(enemies.length){
c.strategy="战争状态";c.army+=2.8;c.treasury-=5;c.stability-=.8;
const e=countries[enemies.sort((a,b)=>power(countries[a])-power(countries[b]))[0]];
if((power(c)<power(e)*.58||c.stability<24||c.treasury<-15)&&Math.random()<.38)peace(c.id,e.id);
return;
}

if(threat>1.45){c.strategy="防御动员";c.army+=2.8;c.treasury-=4;return}

const candidates=ns.filter(i=>!atWar(c.id,i)&&countries[i].alive);
candidates.sort((a,b)=>{
const ha=(-relations[c.id][a])+(power(c)-power(countries[a]))*.09;
const hb=(-relations[c.id][b])+(power(c)-power(countries[b]))*.09;
return hb-ha;
});
const target=candidates[0];
if(target!==undefined){

function playerWarFatigue(target){
const p=getWarPlan(player,target),k=warKey(player,target);
const [a,b]=k.split("-").map(Number);
return player===a?p.fatigueA:p.fatigueB;
}
function enemyWarFatigue(target){
const p=getWarPlan(player,target),k=warKey(player,target);
const [a,b]=k.split("-").map(Number);
return target===a?p.fatigueA:p.fatigueB;
}
function transferBorderLand(from,to,count=2){
const cells=[];
for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++)if(owner[idx(x,y)]===from){
if(owner[idx(x+1,y)]===to||owner[idx(x-1,y)]===to||owner[idx(x,y+1)]===to||owner[idx(x,y-1)]===to)cells.push(idx(x,y));
}
cells.sort(()=>Math.random()-.5);
for(let i=0;i<Math.min(count,cells.length);i++)owner[cells[i]]=to;
if(cells.length){mapDirty=true;recount();}
}
function proposePeace(target,term){
if(!atWar(player,target)){toast("当前没有与该国交战。");return}
const p=countries[player],e=countries[target],ourFat=playerWarFatigue(target),theirFat=enemyWarFatigue(target);

if(term==="赔款")accept-=.18;
if(term==="边境让步")accept-=.27;
accept=clamp(accept,.08,.9);
if(Math.random()<accept){
if(term==="赔款"){const pay=Math.min(25,Math.max(8,e.treasury*.18));e.treasury-=pay;p.treasury+=pay}
if(term==="边境让步")transferBorderLand(target,player,3);
peace(player,target);
logEvent("和平协议",term==="白和平"?`${p.name} 与 ${e.name} 停止战争，边界基本恢复现状。`:term==="赔款"?`${e.name} 接受停战并支付战争赔偿。`:`${e.name} 接受边境让步后停战。`,"good");
toast(`${e.name} 接受了你的停战条件。`);

logEvent("谈判破裂",`${e.name} 拒绝了 ${p.name} 提出的停战方案。`,"warn");
}
renderPanels();
}

function coalitionSupport(attacker,defender){
let support=0, names=[];
for(const c of countries){
if(!c.alive||c.id===attacker||c.id===defender)continue;
if(atWar(c.id,defender)&&!atWar(c.id,attacker)){
const rel=relations[c.id][attacker],coord=rel>45?.85:rel>15?.72:.60;
support+=power(c)*coord;
names.push({name:c.name,coord});
}
}
return {support,names};
}
function warForecast(attacker,defender){
const A=countries[attacker],D=countries[defender],plan=getWarPlan(attacker,defender);
const allies=coalitionSupport(attacker,defender);
const enemyAllies=coalitionSupport(defender,attacker);
const aSupply=plan? (attacker===Math.min(attacker,defender)?plan.supplyA:plan.supplyB):100;
const dSupply=plan? (defender===Math.min(attacker,defender)?plan.supplyA:plan.supplyB):100;
const aFat=plan? (attacker===Math.min(attacker,defender)?plan.fatigueA:plan.fatigueB):0;
const dFat=plan? (defender===Math.min(attacker,defender)?plan.fatigueA:plan.fatigueB):0;
const aEff=(power(A)+allies.support)*(.78+aSupply/430)*clamp(1-aFat*.0035,.75,1);
const dEff=(power(D)+enemyAllies.support)*(.82+dSupply/420)*clamp(1-dFat*.0035,.75,1);
const ratio=aEff/Math.max(1,dEff);
const label=ratio>1.55?"明显优势":ratio>1.16?"略占优势":ratio>.88?"势均力敌":ratio>.64?"略处劣势":"明显劣势";
const factors=[];
factors.push({good:(power(A)+allies.support)>(power(D)+enemyAllies.support),text:(power(A)+allies.support)>(power(D)+enemyAllies.support)?"联军总体力量占优":"敌方总体力量占优"});
if(allies.names.length)factors.push({good:true,text:`${allies.names.length} 个友军正在共同施压，但存在协调损耗`});
if(aSupply<dSupply-10)factors.push({good:false,text:"我方补给更吃紧"});
else if(aSupply>dSupply+10)factors.push({good:true,text:"我方补给更稳定"});
if(aFat>dFat+12)factors.push({good:false,text:"我方战争疲劳更高"});
else if(dFat>aFat+12)factors.push({good:true,text:"敌方战争疲劳更高"});
if(plan?.posture==="闪击")factors.push({good:null,text:"闪击提高进攻强度，但失败代价更高"});
return {label,ratio,factors: factors.slice(0,4),allies};
}

function simulateWar(a,b){
const A=countries[a],B=countries[b]; if(!A.alive||!B.alive){wars.delete(warKey(a,b));return}
let border=borders(a,b);if(!border){peace(a,b);return}
const plan=getWarPlan(a,b);
const coa=coalitionSupport(a,b),cob=coalitionSupport(b,a);
let pa=(power(A)+coa.support)*(rand(1.12,.89))*(.75+A.food/400), pb=(power(B)+cob.support)*(rand(1.12,.89))*(.75+B.food/400);
const pA=(a===player||b===player)?plan:null;
const eff=objectiveEffect(plan);
plan.supplyA=supplyState(A,B,plan,a===player);
plan.supplyB=supplyState(B,A,plan,b===player);
if(a===player){pa*=eff.atk*(.72+plan.supplyA/360)}
else pa*=.72+plan.supplyA/360;
if(b===player){pb*=eff.atk*(.72+plan.supplyB/360)}
else pb*=.72+plan.supplyB/360;
pa*=clamp(1-plan.fatigueA*.004,.72,1);
pb*=clamp(1-plan.fatigueB*.004,.72,1);
if(pA){
const playerSide=a===player?"A":"B";
const posture=pA.posture;
let mult=1;
if(posture==="闪击")mult=1.16;
else if(posture==="坚守")mult=.92;
else if(posture==="战略撤退")mult=.78;
if(playerSide==="A")pa*=mult;else pb*=mult;
}
const costA=2.4*(a===player?eff.cost:1),costB=2.4*(b===player?eff.cost:1);
A.treasury-=costA;B.treasury-=costB;A.food-=1.3;B.food-=1.3;A.stability-=.42;B.stability-=.42;
plan.fatigueA=clamp(plan.fatigueA+1.6+(plan.posture==="闪击"&&a===player?1.8:0),0,100);
plan.fatigueB=clamp(plan.fatigueB+1.6+(plan.posture==="闪击"&&b===player?1.8:0),0,100);
if(plan.posture==="战略撤退"&&a===player)plan.fatigueA=Math.max(0,plan.fatigueA-2);
if(plan.posture==="战略撤退"&&b===player)plan.fatigueB=Math.max(0,plan.fatigueB-2);
A.army=Math.max(2,A.army-rand(1.4,.3));B.army=Math.max(2,B.army-rand(1.4,.3));
let winner=pa>pb?a:b, loser=winner===a?b:a, take=0;
const candidates=[];
for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++) if(owner[idx(x,y)]===loser){
if(owner[idx(x+1,y)]===winner||owner[idx(x-1,y)]===winner||owner[idx(x,y+1)]===winner||owner[idx(x,y-1)]===winner) candidates.push(idx(x,y));
}
candidates.sort(()=>Math.random()-.5);
let dirMod=1;
if((a===player||b===player)&&plan.direction!=="全线")dirMod=1.18;
if((a===player||b===player)&&plan.posture==="坚守")dirMod=.72;
if((a===player||b===player)&&plan.posture==="战略撤退")dirMod=.42;
let objMove=(a===player||b===player)?eff.move:1;let quota=Math.min(candidates.length,Math.max(1,Math.floor(border*.08*dirMod*objMove*clamp(Math.abs(pa-pb)/Math.max(pa,pb)+.18,.08,.42))));
for(let i=0;i<quota;i++){owner[candidates[i]]=winner;take++}
if(take>0){mapDirty=true;addSignal(winner,loser,"战事","war",5);if(winner===player||loser===player||neighbors(player).includes(winner)||neighbors(player).includes(loser))toast(`${countries[winner].name} 的前线发生推进，国境已改变。`)}
if(take>0 && Math.random()<.25) logEvent("前线推进",`${countries[winner].name} 在对 ${countries[loser].name} 的战线上取得推进。${battleWhy(a,b,winner)}`);
if(take>0&&(winner===player||loser===player)){
const wp=getWarPlan(player,winner===player?loser:winner);
if(winner===player&&wp.objective==="切断补给"){
if(player===a)wp.supplyB=Math.max(25,wp.supplyB-8);else wp.supplyA=Math.max(25,wp.supplyA-8);
}
if(winner===player&&wp.objective==="占领工业区"){countries[loser].industry=Math.max(5,countries[loser].industry-1.2);countries[player].industry+=.35}
if(winner===player&&wp.objective==="夺取首都"&&Math.random()<.10){countries[loser].stability-=5;logEvent("首都受威胁",`${countries[player].name} 的攻势正在逼近 ${countries[loser].name} 的政治中心。`,"bad")}
}
recount();
battleIncident(a,b,winner,loser,take);
if(!countries[loser].alive){
logEvent("国家灭亡",`${countries[loser].name} 失去了最后的有效领土。`,"bad");
[...wars].forEach(k=>{if(k.split("-").map(Number).includes(loser))wars.delete(k)});
}
}

function addSignal(a,b,label,type="warn",life=7){
const lo=Math.min(a,b),hi=Math.max(a,b);
const priority=type==="war"?3:type==="bad"?2:type==="warn"?1:0;
const old=mapSignals.find(s=>Math.min(s.a,s.b)===lo&&Math.max(s.a,s.b)===hi);
if(old){
const oldP=old.type==="war"?3:old.type==="bad"?2:old.type==="warn"?1:0;
if(priority>=oldP){old.label=label;old.type=type}
old.until=Math.max(old.until,year+life);
}else mapSignals.push({a,b,label,type,until:year+life});
if(mapSignals.length>8)mapSignals.shift();
}
function addSituation(a,b,type,level=1){
const lo=Math.min(a,b),hi=Math.max(a,b);let s=situations.find(x=>x.a===lo&&x.b===hi);
if(!s){s={a:lo,b:hi,type,level,start:year};situations.push(s)}else{s.type=type;s.level=Math.max(s.level,level)}
return s;
}
function playerSpillover(a,b,kind){

const p=countries[player];
if(kind==="tension"){p.treasury-=3;p.stability-=1;toast("附近局势恶化：你的贸易与安全成本上升。")}
if(kind==="war"){p.treasury-=5;p.food-=3;p.stability-=2;toast("邻近战争冲击你的贸易、粮食与稳定。")}
if(kind==="trade"){p.treasury+=4;toast("附近贸易改善，为你的经济带来外溢收益。")}
}
function advanceSituations(){
for(const s of [...situations]){
const A=countries[s.a],B=countries[s.b];
if(!A?.alive||!B?.alive){situations=situations.filter(x=>x!==s);continue}
if(atWar(s.a,s.b)){s.type="战争";s.level=4;continue}
const rel=relations[s.a][s.b];
if(s.type==="摩擦"){
A.army+=1.2;B.army+=1.2;A.treasury-=1;B.treasury-=1;
if(rel<-38&&Math.random()<.22+worldTension*.002){s.type="对峙";s.level=2;logEvent("边境对峙",`${A.name} 与 ${B.name} 将边境摩擦升级为持续军事对峙。`,"bad");addSignal(s.a,s.b,"对峙","bad",9);playerSpillover(s.a,s.b,"tension")}
else if(Math.random()<.12){setRelation(s.a,s.b,10);situations=situations.filter(x=>x!==s);logEvent("摩擦缓和",`${A.name} 与 ${B.name} 的边境摩擦暂时平息。`,"good")}
}else if(s.type==="对峙"){
A.army+=2;B.army+=2;A.treasury-=2.2;B.treasury-=2.2;A.stability-=.25;B.stability-=.25;
const ratio=power(A)/Math.max(1,power(B));
if(rel<-52&&Math.random()<.18+worldTension*.0025){
const attacker=ratio>1.08?s.a:ratio<.92?s.b:(Math.random()<.5?s.a:s.b);
declareWar(attacker,attacker===s.a?s.b:s.a);s.type="战争";s.level=4;addSignal(s.a,s.b,"战争爆发","war",12);playerSpillover(s.a,s.b,"war")
}else if(Math.random()<.08){setRelation(s.a,s.b,16);s.type="摩擦";s.level=1;logEvent("紧张降级",`${A.name} 与 ${B.name} 从军事对峙退回低强度摩擦。`,"good")}
}else if(s.type==="军备竞赛"){
A.army+=1.8;B.army+=1.8;A.treasury-=1.8;B.treasury-=1.8;
if(rel<-42&&Math.random()<.16){s.type="对峙";s.level=2;logEvent("军备竞赛升级",`${A.name} 与 ${B.name} 的军备竞赛演变为边境对峙。`,"bad");addSignal(s.a,s.b,"军备→对峙","bad",8)}
else if(year-s.start>10&&Math.random()<.15){situations=situations.filter(x=>x!==s)}
}
}
mapSignals=mapSignals.filter(x=>x.until>=year);
}

function financeSnapshot(c){
const normalIncome=c.industry*.17+c.pop*.022;
const armyUpkeep=c.army*.105*(austerity&&c.id===player?.82:1);
const industryUpkeep=c.industry*.038*(austerity&&c.id===player?.88:1);
const adminCost=Math.max(0,c.territory/95-1)*1.2*(austerity&&c.id===player?.82:1);
const warCost=[...wars].some(k=>k.split("-").map(Number).includes(c.id))?5.5+c.army*.025:0;
const net=normalIncome-armyUpkeep-industryUpkeep-adminCost-warCost;
return {normalIncome,armyUpkeep,industryUpkeep,adminCost,warCost,net};

c.treasury+=f.net;

const shortage=Math.max(0,45-c.food);
const debt=Math.max(0,-c.treasury);

const overheat=Math.max(0,c.industry-95)*.015;
let stabDelta=clamp((c.food-52)/55,-1.7,.65)-Math.min(1.6,debt/80)-shortage*.018-militarization*.018-overheat;
if(austerity&&c.id===player){stabDelta-=.45;c.industry=Math.max(5,c.industry-.18)}
c.stability+=stabDelta;
if(c.treasury>180)c.treasury-=Math.min(8,(c.treasury-180)*.08);c.food=clamp(c.food,0,180);c.treasury=clamp(c.treasury,-80,260);c.stability=clamp(c.stability,5,100);
if(c.stability<38&&Math.random()<.12){c.industry*=.985;c.treasury-=5;logEvent("社会不安",`${c.name} 的社会压力开始影响生产和财政。`,"warn")}
if(c.stability<20&&Math.random()<.22){c.army*=.9;c.treasury-=10;logEvent("国内危机",`${c.name} 因长期失稳发生大规模骚乱。`,"bad")}

}

if(year>=nextEventYear&&!pendingEvent){randomCrisis();nextEventYear=year+Math.floor(rand(17,11))}

function normalizeRelations(){
for(let i=0;i<N;i++)for(let j=i+1;j<N;j++) if(!atWar(i,j)&&countries[i].alive&&countries[j].alive){
const adj=neighbors(i).includes(j);
const personality=(countries[i].trade+countries[j].trade)*.22;
const tensionDrag=adj?worldTension*.035:worldTension*.012;
relations[i][j]=relations[j][i]=clamp(relations[i][j]+rand(4,-4)+personality-tensionDrag,-100,100);
}
}
function checkEnd(){
const p=countries[player];

}

}

function stat(a,b){return `<div class="stat"><span>${a}</span><b>${b}</b></div>`}
function rebuildTexture(){
if(!countries.length)return;
const img=ox.createImageData(W,H),data=img.data;
for(let y=0;y<H;y++)for(let x=0;x<W;x++){
const k=idx(x,y),p=k*4,o=owner[k];
if(!terrain[k]){data[p]=8;data[p+1]=24;data[p+2]=37;data[p+3]=255;continue}
const hex=countries[o]?.color||"#667788",rgb=hex.match(/\w\w/g).map(v=>parseInt(v,16)),shade=(noise2(x,y)+2)*3;
data[p]=clamp(rgb[0]+shade,0,255);data[p+1]=clamp(rgb[1]+shade,0,255);data[p+2]=clamp(rgb[2]+shade,0,255);data[p+3]=255;
}
ox.putImageData(img,0,0);mapDirty=false
}
function draw(){
const rect=canvas.getBoundingClientRect(),dpr=devicePixelRatio||1;
if(canvas.width!==Math.floor(rect.width*dpr)||canvas.height!==Math.floor(rect.height*dpr)){canvas.width=Math.floor(rect.width*dpr);canvas.height=Math.floor(rect.height*dpr)}
ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,rect.width,rect.height);
if(mapDirty)rebuildTexture();
const scale=Math.min(rect.width/W,rect.height/H)*cam.z, dw=W*scale,dh=H*scale;
const x0=(rect.width-dw)/2+cam.x,y0=(rect.height-dh)/2+cam.y;
ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality="high";
ctx.drawImage(off,x0,y0,dw,dh);
ctx.save();ctx.translate(x0,y0);ctx.scale(scale,scale);
ctx.lineWidth=0.42/Math.max(.6,cam.z);ctx.strokeStyle="rgba(5,12,18,.58)";ctx.beginPath();
for(let y=1;y<H-1;y+=1)for(let x=1;x<W-1;x+=1){
let o=owner[idx(x,y)];if(o<0)continue;
if(owner[idx(x+1,y)]!==o){ctx.moveTo(x+1,y);ctx.lineTo(x+1,y+1)}
if(owner[idx(x,y+1)]!==o){ctx.moveTo(x,y+1);ctx.lineTo(x+1,y+1)}
}
ctx.stroke();
for(const s of situations){
const A=countries[s.a],B=countries[s.b];if(!A?.alive||!B?.alive)continue;
const war=atWar(s.a,s.b),pulse=.55+.35*Math.sin(performance.now()/260);
ctx.save();ctx.setLineDash(war?[2.2,1.2]:[1.4,1.4]);ctx.lineWidth=(war?1.45:.85)/Math.max(.7,cam.z);
ctx.strokeStyle=war?`rgba(255,90,80,${pulse})`:s.type==="对峙"?`rgba(255,165,70,${pulse})`:`rgba(240,205,95,${pulse*.85})`;
ctx.beginPath();ctx.moveTo(A.cap.x,A.cap.y);ctx.lineTo(B.cap.x,B.cap.y);ctx.stroke();ctx.restore();
}
for(const c of countries)if(c.alive){
ctx.beginPath();ctx.arc(c.cap.x,c.cap.y,c.id===selected?2.2:1.4,0,Math.PI*2);ctx.fillStyle="#f7f5e8";ctx.fill();
if(cam.z>1.15||c.id===selected){ctx.font="3.6px system-ui";ctx.fillStyle="#fff";ctx.textAlign="center";ctx.fillText(c.name.split(" ")[0],c.cap.x,c.cap.y-3)}
}
const drawn=[];
for(const s of mapSignals){
const A=countries[s.a],B=countries[s.b];if(!A||!B)continue;
const mx=(A.cap.x+B.cap.x)/2,my=(A.cap.y+B.cap.y)/2;
if(drawn.some(p=>Math.hypot(p.x-mx,p.y-my)<9))continue;
drawn.push({x:mx,y:my});
ctx.font="bold 3.3px system-ui";ctx.textAlign="center";
ctx.fillStyle=s.type==="war"?"#ffd2cf":s.type==="good"?"#c9ffe2":"#ffe2a6";
ctx.fillText(s.label.length>6?s.label.slice(0,6):s.label,mx,my-2);
}
ctx.restore();
}
function screenToMap(sx,sy){
const r=canvas.getBoundingClientRect(),scale=Math.min(r.width/W,r.height/H)*cam.z,dw=W*scale,dh=H*scale;
const x0=(r.width-dw)/2+cam.x,y0=(r.height-dh)/2+cam.y;
return {x:Math.floor((sx-x0)/scale),y:Math.floor((sy-y0)/scale)}
}
canvas.addEventListener("click",e=>{if(drag&&drag.moved)return;let p=screenToMap(e.offsetX,e.offsetY);if(p.x>=0&&p.x<W&&p.y>=0&&p.y<H){let o=owner[idx(p.x,p.y)];if(o>=0){selected=o;document.querySelector('[data-tab="country"]').click();renderPanels()}}});
canvas.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y,moved:false};canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener("pointermove",e=>{if(!drag)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>3)drag.moved=true;cam.x=drag.cx+dx;cam.y=drag.cy+dy});
canvas.addEventListener("pointerup",()=>drag=null);

requestAnimationFrame(loop);
})();</script></body></html>
